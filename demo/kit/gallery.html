<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>构件库 · Kit Gallery</title>
<style>
  :root {
    --paper: #fcf5da; --card: #fffdf3; --ink: #2a2118; --muted: #9a8b78;
    --line: #e8dfcc; --accent: #c8892a; --accent-soft: #f6e7c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  a { color: var(--accent); }
  /* 顶部导航条：与素材总目录 / 构件工坊保持一致的工作区入口 */
  body { padding-top: 30px; }
  .worknav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 11; height: 30px;
    display: flex; align-items: center; gap: 2px; padding: 0 16px;
    background: #16161a; border-bottom: 1px solid #33333d;
    font: 12px/1 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    overflow-x: auto; white-space: nowrap;
  }
  .worknav .brand {
    margin-right: 10px; color: #9a98a3; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .worknav a {
    padding: 4px 10px; border-radius: 5px; color: #9a98a3; text-decoration: none;
  }
  .worknav a:hover { background: #26262e; color: #e6e4df; }
  .worknav a.on { background: rgba(232, 182, 76, .12); color: #e8b64c; }
  header {
    position: sticky; top: 30px; z-index: 10;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: color-mix(in srgb, var(--paper) 92%, white);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .02em; }
  header .count { color: var(--muted); font-size: 12px; }
  header input {
    margin-left: auto; width: 240px; max-width: 40vw; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    font: inherit; color: var(--ink); outline: none;
  }
  header input:focus { border-color: var(--accent); }
  nav {
    position: fixed; left: 0; top: 83px; bottom: 0; width: 168px; overflow: auto;
    padding: 14px 10px 40px; border-right: 1px solid var(--line); background: var(--paper);
  }
  nav a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 12px; }
  nav a:hover { background: var(--accent-soft); }
  nav a .n { color: var(--muted); float: right; }
  main { margin-left: 168px; padding: 20px 24px 80px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .card.hide { display: none; }
  .card-head { display: flex; align-items: baseline; gap: 8px; }
  .card-head b { font-size: 13px; }
  .card-head code { color: var(--muted); font-size: 11px; }
  .card-head .cat {
    margin-left: auto; font-size: 10px; padding: 1px 7px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent);
  }
  .card p.desc { margin: 0; color: var(--muted); font-size: 11.5px; min-height: 2.4em; }
  .preview {
    display: block; margin: 0 auto; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); image-rendering: pixelated;
  }
  .params { display: grid; gap: 6px; }
  .param { display: grid; grid-template-columns: 64px 1fr 46px; align-items: center; gap: 8px; font-size: 11px; }
  .param label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .param input[type=range] { width: 100%; accent-color: var(--accent); }
  .param output { text-align: right; color: var(--accent); }
  .card-foot { display: flex; gap: 8px; align-items: center; }
  .card-foot button {
    font: inherit; font-size: 11px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
  }
  .card-foot button:hover { border-color: var(--accent); color: var(--accent); }
  .card-foot .seed { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
  .card-foot .seed input { width: 54px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font: inherit; }
  .snippet {
    display: none; margin: 0; padding: 8px 10px; border-radius: 8px; background: #2a2118;
    color: #f6e7c4; font-size: 10.5px; line-height: 1.5; overflow: auto; max-height: 160px; white-space: pre;
  }
  .snippet.show { display: block; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  #c { position: fixed; left: -9999px; top: 0; }
</style>
</head>
<body>

<div class="worknav" role="navigation" aria-label="页面导航">
  <span class="brand">像素微缩实验室</span>
  <a href="catalog.html">总目录</a>
  <a href="../studio/app.html">构件工坊</a>
  <a href="gallery.html" class="on" aria-current="page">陈列页</a>
  <a href="../studio/editor.html">场景</a>
</div>

<header>
  <h1>构件库 · Kit Gallery</h1>
  <span class="count" id="count"></span>
  <input id="search" type="search" placeholder="搜索 id / 名称 / 分类…">
</header>

<nav id="nav"></nav>
<main id="main"></main>

<!-- 共享渲染画布（离屏；每个卡片的预览从它拷贝像素） -->
<canvas id="c"></canvas>

<script>
  /* 预览画布尺寸（构件在这个画布里渲染，再拷进各卡片） */
  window.PP_W = 220; window.PP_H = 250;
  window.PP_SCALE = 8; window.PP_ORIGIN_X = 0; window.PP_ORIGIN_Y = 78;
  window.PP_HEADLESS = true;
</script>
<script src="../engine.js"></script>
<script src="core.js"></script>
<script src="render.js"></script>
<script src="palette.js"></script>
<script src="trees.js"></script>
<script src="plants.js"></script>
<script src="buildings.js"></script>
<script src="stoneworks.js"></script>
<script src="cart.js"></script>
<script src="props.js"></script>
<script src="conifers.js"></script>
<script src="ref-buildings.js"></script>
<script src="ref-structures.js"></script>

<script>
'use strict';
/* ------------------------------------------------------------------
 * 构件库 Gallery —— 像 Bootstrap 文档一样的构件陈列页
 *
 * 每个构件一张卡片：
 *   · 实时预览（在共享离屏画布上渲染，再把像素拷进卡片 canvas）
 *   · 参数滑块 → 实时改参数重渲染（这只是"预览参数"，不写回源码）
 *   · 随机种子输入 → 换一个随机形态
 *   · 「用法」按钮 → 展开可直接复制的调用代码
 *
 * 数据全部来自运行时注册表 KIT.components —— 新增构件自动出现在这里，
 * 不需要改这个页面。
 * ------------------------------------------------------------------ */

const CAT_NAME = { tree: '树', building: '建筑', plant: '草木', prop: '道具', figure: '人物' };
const CAT_ORDER = ['tree', 'building', 'plant', 'prop', 'figure'];

const mainEl = document.getElementById('main');
const navEl = document.getElementById('nav');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');

const cards = [];   // { id, def, params, seed, canvas, ctx2d, el }

/* ---------- 渲染一张卡片 ---------- */
/* 单遍渲染到共享缓冲（返回非背景包围盒） */
function renderOnce(card, scale) {
  zb.fill(-1e9);
  pix.fill(SKY_BG);
  ground.fill(0); kinds.fill(0);
  groundZ.fill(0); shadowMask.fill(0); staticShadow.fill(0);

  const inst = {
    id: 'preview', kind: card.id, x: 0, y: 0, z: 0, rot: 0, scale,
    params: Object.assign({}, card.params), seed: card.seed,
  };
  try {
    const def = KIT.get(card.id);
    if (def && def.draw) def.draw(KIT_RENDER.makeCtx(inst), inst);
    shadeEdges();
  } catch (e) {
    console.warn('构件渲染失败:', card.id, e);
    return null;
  }
  let minX = W, maxX = -1, minY = H, maxY = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (pix[y * W + x] === SKY_BG) continue;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return maxX < 0 ? null : { minX, maxX, minY, maxY };
}

function renderCard(card) {
  /* 渲染一遍 scale=1 → 量包围盒 → 在**拷贝阶段**做最近邻放大/居中。
     不依赖构件的 ctx.scale（逐像素自绘的构件不支持实例缩放）。 */
  const box = renderOnce(card, 1);

  const img = card.ctx2d.createImageData(W, H);
  const dst = new Uint32Array(img.data.buffer);
  dst.fill(SKY_BG);

  if (box) {
    const tw = box.maxX - box.minX + 1, th = box.maxY - box.minY + 1;
    let k = Math.min(W * .82 / tw, H * .82 / th);
    if (k >= 1) k = Math.floor(k);            // 放大取整数倍（像素均匀）
    k = Math.max(.25, Math.min(4, k));
    const bcx = (box.minX + box.maxX) / 2, bcy = (box.minY + box.maxY) / 2;
    const cx = W / 2, cy = H / 2;
    for (let y = 0; y < H; y++) {
      const sy = Math.round(bcy + (y - cy) / k);
      if (sy < box.minY || sy > box.maxY) continue;
      for (let x = 0; x < W; x++) {
        const sx = Math.round(bcx + (x - cx) / k);
        if (sx < box.minX || sx > box.maxX) continue;
        dst[y * W + x] = pix[sy * W + sx];
      }
    }
  } else {
    dst.set(pix);
  }
  card.ctx2d.putImageData(img, 0, 0);

  // 更新代码片段
  card.snippet.textContent = usageSnippet(card);
}

const SKY_BG = rgb(252, 245, 218);

function usageSnippet(card) {
  const params = Object.keys(card.params).length
    ? '{\n    ' + Object.entries(card.params)
        .map(([k, v]) => `${k}: ${typeof v === 'number' ? +v.toFixed(2) : JSON.stringify(v)}`)
        .join(',\n    ') + '\n  }'
    : '{}';
  return `// ${KIT.get(card.id).name}（${card.id}）\n`
       + `const inst = {\n  id: 'a', kind: '${card.id}',\n  x: 0, y: 0, z: 0, rot: 0,\n`
       + `  params: ${params},\n  seed: ${card.seed},\n};\n`
       + `KIT.get('${card.id}').draw(KIT_RENDER.makeCtx(inst), inst);`;
}

/* ---------- 建卡片 ---------- */
function buildCard(id, container) {
  const def = KIT.get(id);
  const params = Object.assign({}, KIT.defaults(id));
  const card = { id, def, params, seed: 42 };

  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.id = id;
  el.dataset.search = (id + ' ' + def.name + ' ' + def.category + ' ' + (def.desc || '')).toLowerCase();

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `<b>${def.name}</b><code>${id}</code>`
    + `<span class="cat">${CAT_NAME[def.category] || def.category}</span>`;
  el.appendChild(head);

  const desc = document.createElement('p');
  desc.className = 'desc';
  desc.textContent = def.desc || '';
  el.appendChild(desc);

  /* 预览画布：内部 W×H，CSS 放大显示 */
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  cv.className = 'preview';
  const dispScale = Math.max(1, Math.floor(200 / Math.max(W, H)) + 1);
  cv.style.width = Math.round(W * dispScale) + 'px';
  cv.style.height = Math.round(H * dispScale) + 'px';
  el.appendChild(cv);
  card.canvas = cv;
  card.ctx2d = cv.getContext('2d');

  /* 参数滑块 */
  const box = document.createElement('div');
  box.className = 'params';
  const paramKeys = Object.keys(def.params || {});
  for (const key of paramKeys) {
    const p = def.params[key];
    const row = document.createElement('div');
    row.className = 'param';
    const lab = document.createElement('label');
    lab.textContent = key;
    lab.title = p.desc || key;
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step;
    input.value = p.def;
    const out = document.createElement('output');
    out.textContent = p.def;
    input.addEventListener('input', () => {
      card.params[key] = parseFloat(input.value);
      out.textContent = (+input.value).toFixed(p.step < .1 ? 2 : p.step < 1 ? 2 : 0);
      renderCard(card);
    });
    row.appendChild(lab); row.appendChild(input); row.appendChild(out);
    box.appendChild(row);
  }
  el.appendChild(box);

  /* 底部：用法 / 随机 / 种子 */
  const foot = document.createElement('div');
  foot.className = 'card-foot';
  const btnUse = document.createElement('button');
  btnUse.textContent = '用法';
  const snippet = document.createElement('pre');
  snippet.className = 'snippet';
  btnUse.addEventListener('click', () => {
    snippet.classList.toggle('show');
    btnUse.textContent = snippet.classList.contains('show') ? '收起' : '用法';
  });
  const btnRnd = document.createElement('button');
  btnRnd.textContent = '换一个';
  btnRnd.addEventListener('click', () => {
    card.seed = (Math.random() * 9999) | 0;
    seedInput.value = card.seed;
    renderCard(card);
  });
  const seedWrap = document.createElement('label');
  seedWrap.className = 'seed';
  seedWrap.textContent = 'seed';
  const seedInput = document.createElement('input');
  seedInput.type = 'number'; seedInput.value = card.seed;
  seedInput.addEventListener('change', () => {
    card.seed = parseInt(seedInput.value, 10) || 0;
    renderCard(card);
  });
  seedWrap.appendChild(seedInput);
  foot.appendChild(btnUse); foot.appendChild(btnRnd); foot.appendChild(seedWrap);
  el.appendChild(foot);
  el.appendChild(snippet);
  card.snippet = snippet;

  container.appendChild(el);
  cards.push(card);
  renderCard(card);
}

/* ---------- 组装页面 ---------- */
(function build() {
  const byCat = {};
  for (const c of KIT.list()) {
    (byCat[c.category] || (byCat[c.category] = [])).push(c);
  }
  let total = 0;
  for (const cat of CAT_ORDER) {
    const list = byCat[cat];
    if (!list || !list.length) continue;
    const sec = document.createElement('section');
    sec.id = 'cat-' + cat;
    const h2 = document.createElement('h2');
    h2.textContent = `${CAT_NAME[cat] || cat}（${list.length}）`;
    sec.appendChild(h2);
    const grid = document.createElement('div');
    grid.className = 'grid';
    sec.appendChild(grid);
    mainEl.appendChild(sec);
    total += list.length;
    for (const c of list) buildCard(c.id, grid);

    const a = document.createElement('a');
    a.href = '#cat-' + cat;
    a.innerHTML = `${CAT_NAME[cat] || cat}<span class="n">${list.length}</span>`;
    navEl.appendChild(a);
  }
  countEl.textContent = `${total} 个构件`;
})();

/* ---------- 搜索 ---------- */
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  for (const card of cards) {
    const el = mainEl.querySelector(`.card[data-id="${card.id}"]`);
    if (!el) continue;
    el.classList.toggle('hide', q !== '' && !el.dataset.search.includes(q));
  }
  // 空分类整段隐藏
  for (const sec of mainEl.querySelectorAll('section')) {
    const visible = sec.querySelectorAll('.card:not(.hide)').length;
    sec.style.display = visible ? '' : 'none';
  }
});
</script>
</body>
</html>
