<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>构件预览</title>
<style>
  html,body{margin:0;height:100%;background:#0e0e11;overflow:hidden}
  body{position:relative}
  /* 画布由 JS 设 width/height + transform 平移，永远居中显示 */
  canvas{position:absolute;left:50%;top:50%;display:block;image-rendering:pixelated;
         transform:translate(-50%,-50%);transform-origin:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>window.PP_W=520;window.PP_H=560;window.PP_SCALE=14;window.PP_ORIGIN_X=0;window.PP_ORIGIN_Y=34;</script>
<script src="../engine.js"></script>
<script src="../engine-light.js"></script>
<script src="preview-kit.js"></script>
<script src="../kit/behavior.js"></script>
<script src="../kit/behavior-extra.js"></script>
<!-- 构件源文件：让沙箱里具备各文件自己的辅助函数（coneCanopy / kitWoodWall 等），
     否则单独注入 register 块会因找不到 helper 而画不出来。
     palette.js 不加载：它的常量 preview-kit.js 已全部提供，重复声明会 SyntaxError。 -->
<script src="../kit/trees.js"></script>
<script src="../kit/conifers.js"></script>
<script src="../kit/plants.js"></script>
<script src="../kit/buildings.js"></script>
<script src="../kit/stoneworks.js"></script>
<script src="../kit/cart.js"></script>
<script src="../kit/props.js"></script>
<script src="../kit/ref-buildings.js"></script>
<script src="../kit/ref-structures.js"></script>
<script src="../kit/ref-plants.js"></script>
<script src="../kit/ref-surfaces.js"></script>
<script src="../kit/ref-props.js"></script>
<script src="../kit/ref-props-small.js"></script>
<script src="preview.js"></script>
</body>
</html>
