<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>屋顶晾衣 · Rooftop Laundry</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; user-select: none; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
  #scores { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); pointer-events: none; }
  #scores b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #scores span { color: var(--muted); margin-left: 6px; }
  #bottom {
    position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 16px;
    pointer-events: none;
  }
  #status { color: var(--muted); }
  #hint { color: var(--muted); text-align: right; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="屋顶晾衣：把晾衣绳上的衣服拖进藤篮，赶在暴雨前收完"></canvas></div>
<div id="scores"><b id="score">0</b><span>件已收</span></div>
<div id="bottom"><div id="status">把衣服拖进藤篮</div><div id="hint">空格：收下一件 · 结束后点击重来</div></div>

<script>
  /* 画布与世界尺度：沿用参考项目的 360×280 / S=10，屋顶刚好落在画面中央 */
  window.PP_W = 360;
  window.PP_H = 280;
  window.PP_SCALE = 10;
  window.PP_ORIGIN_Y = -18;
  /* 光源略偏右前，影子落到左后，与原作一致 */
  window.LIGHT = {
    dir: { x: -0.55, y: -0.6, z: 0.58 },
    shadow: { x: 0.9, y: -0.35 },
    tint: [1, 1, 1], ambient: 1, vignette: 0, points: [],
  };
</script>
<script src="../engine.js"></script>
<script src="scene.js"></script>
<script src="cloth.js"></script>
<script src="weather.js"></script>
<script src="laundry.js"></script>
</body>
</html>
