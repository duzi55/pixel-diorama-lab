<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>秋日山村 · Pixel Diorama</title>
<style>
  :root {
    --ink: #2a2118;
    --muted: #9a8b78;
    --paper: #fcf5da; /* 统一纸色背景，整个页面与 Canvas 完全一体 */
    --line: #e8dfcc;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }
  body {
    font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--paper);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    cursor: default;
    outline: none;
    background: var(--paper);
  }
  #hud {
    position: fixed;
    left: max(20px, env(safe-area-inset-left));
    top: max(18px, env(safe-area-inset-top));
    pointer-events: none;
  }
  #hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #hud p { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="秋日山村等距像素场景，点击村民可打招呼"></canvas></div>

<div id="hud">
  <h1>秋日山村 · Autumn Diorama</h1>
  <p>点击村民打招呼 · 黄色小车行驶 · 树在风中微漾</p>
</div>

<script>
  /* 画布分辨率与世界尺度映射（微缩模型标准清晰度，细节精致分明） */
  window.PP_W = 600;
  window.PP_H = 760;
  window.PP_SCALE = 12;
  window.PP_ORIGIN_X = 8;
  window.PP_ORIGIN_Y = -21;
</script>
<script src="../engine.js"></script>
<script src="../kit/core.js"></script>
<script src="../kit/render.js"></script>
<script src="../kit/conifers.js"></script>
<script src="../kit/figures.js"></script>
<script src="figures.js"></script>
<script src="palette.js"></script>
<script src="terrain.js"></script>
<script src="houses.js"></script>
<script src="foliage.js"></script>
<script src="villagers.js"></script>
<script src="road.js"></script>
<script src="falling.js"></script>
<script src="village.js"></script>
</body>
</html>
