<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>秋日山村 · Pixel Diorama</title>
<style>
  :root {
    --ink: #2a2118;
    --muted: #9a8b78;
    --paper: #fcf5da; /* 统一纸色背景，整个页面与 Canvas 完全一体 */
    --line: #e8dfcc;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }
  body {
    font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--paper);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    cursor: default;
    outline: none;
    background: var(--paper);
  }
  #hud {
    position: fixed;
    left: max(20px, env(safe-area-inset-left));
    top: max(18px, env(safe-area-inset-top));
    pointer-events: none;
  }
  #hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #hud p { margin: 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="秋日山村等距像素场景，点击村民可打招呼"></canvas></div>

<div id="hud">
  <h1>秋日山村 · Autumn Diorama</h1>
  <p>点击村民打招呼 · 黄色小车行驶 · 树在风中微漾</p>
</div>

<script>
  /* ★ 画布铺满浏览器窗口，**1 画布像素 = 1 CSS 像素**（画面大小不随窗口变）。
     S=12 是"世界单位→画布像素"，不变；窗口多大画布就多大，
     多出来的区域由地面/公路延展并有机消散。
     无头工具设 PP_HEADLESS=true，用 600×760 兜底。 */
  window.PP_SCALE = 13.5;
  window.PP_ORIGIN_X = 8;
  window.PP_ORIGIN_Y = -21;
  if (window.PP_HEADLESS) {
    window.PP_W = 600; window.PP_H = 760;
  } else {
    window.PP_FULLSCREEN = true;
    window.PP_W = Math.ceil(innerWidth);
    window.PP_H = Math.ceil(innerHeight);
  }
</script>
<script src="../engine.js"></script>
<script src="../kit/core.js"></script>
<script src="../kit/render.js"></script>
<script src="../kit/conifers.js"></script>
<script src="../kit/figures.js"></script>
<script src="figures.js"></script>
<script src="palette.js"></script>
<script src="terrain.js"></script>
<script src="houses.js"></script>
<script src="foliage.js"></script>
<script src="villagers.js"></script>
<script src="road.js"></script>
<script src="falling.js"></script>
<script src="village.js"></script>
<script src="../nav.js"></script>
</body>
</html>
