<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>秋日山村 · 植被预览</title>
<style>html,body{margin:0;background:#222}canvas{image-rendering:pixelated;display:block;margin:0 auto}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>window.PP_W=300;window.PP_H=520;window.PP_SCALE=9;window.PP_ORIGIN_X=0;window.PP_ORIGIN_Y=10;</script>
<script src="../engine.js"></script>
<script src="palette.js"></script>
<script src="foliage.js"></script>
<script>
/* 简化地面：椭圆台地 + 公路，用来给树一个参照 */
const RX = 26, RY = 30;
const ROAD_A = [-13,-18], ROAD_B = [17,19], RH = 3.1;
function roadDist(x,y){
  const dx=ROAD_B[0]-ROAD_A[0], dy=ROAD_B[1]-ROAD_A[1];
  const t=Math.max(0,Math.min(1,((x-ROAD_A[0])*dx+(y-ROAD_A[1])*dy)/(dx*dx+dy*dy)));
  return Math.hypot(x-ROAD_A[0]-dx*t, y-ROAD_A[1]-dy*t);
}
function groundColor(x,y,ix,iy){
  const e = Math.pow(Math.pow(Math.abs(x)/RX,4)+Math.pow(Math.abs(y)/RY,4),.25);
  if (e > 1) return 0;
  const rd = roadDist(x,y);
  if (rd < RH) return rgb(96,93,89);
  if (rd < RH+.5) return rgb(178,172,158);
  if (rd < RH+1.4) return rgb(190,184,170);
  const t = noise(x*1.1,y*1.1)*.7 + (hash(ix,iy)-.5)*.4;
  return rgb(...LITTER[clamp(Math.floor(t*4.8),0,4)]);
}
function bakeGround(){
  for (let iy=0;iy<H;iy++) for (let ix=0;ix<W;ix++){
    const g = unproject(ix+.5, iy+.5);
    const c = groundColor(g.x,g.y,ix,iy);
    if (!c) continue;
    const i = iy*W+ix;
    pix[i]=c; ground[i]=1; zb[i]=(g.x+g.y)/R2*COS;
  }
  groundZ.set(zb);
}
zb.fill(-1e9); pix.fill(SKY); ground.fill(0);
bakeGround();
const TREES = planTrees();
growFoliage();
drawShrubs();
for (let i=0;i<30;i++) drawFoliage(i/12);
applyShadows(groundZ);
ctx.putImageData(image,0,0);
console.log('trees:', TREES.length, 'leaves:', leaves.length);
</script>
</body></html>
